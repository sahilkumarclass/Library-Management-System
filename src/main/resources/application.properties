spring.application.name=Library-Management-System

# ---------- Datasource (Neon PostgreSQL) ----------
Real values live in `application-local.properties` (gitignored) or env vars.
Note the JDBC URL must start with `jdbc:postgresql://` (not just `postgresql://`).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP tuning for Neon serverless (keeps pool lean, accounts for cold starts)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Default is for local dev only. Set JWT_SECRET in env (or override below) for prod.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-in-prod-please-rotate-to-32plus-chars-base64}
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Server ----------
server.port=8081

# ---------- Local overrides ----------
# Spring loads `application-local.properties` from the classpath if it exists,
# silently skipping when it doesn't. Put real Neon creds + JWT_SECRET there.
spring.config.import=optional:classpath:application-local.properties
